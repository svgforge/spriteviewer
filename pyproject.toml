[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spriteviewer"
dynamic = ["version"]
description = "PySide6 tile viewer for SVG icon sprites"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = ["svg", "sprite", "icons", "viewer", "pyside6", "qt", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "PySide6>=6.12.0",
    "defusedxml>=0.7.1",
    "resvg-py>=0.5.0",  # full SVG 1.1 support (markers, filters, …)
]

[project.scripts]
spriteviewer = "spriteviewer.app:main"

[project.urls]
Homepage = "https://github.com/svgforge/spriteviewer"
Repository = "https://github.com/svgforge/spriteviewer"
Issues = "https://github.com/svgforge/spriteviewer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spriteviewer = ["*.svg"]

[tool.setuptools.dynamic]
version = {attr = "spriteviewer._version.__version__"}

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]